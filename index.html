<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Smoke Over Verona: an 84-second animated short with sound.">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0;font:14px/1.4 system-ui,sans-serif}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Smoke Over Verona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a screening-room page. Title block, the letterboxed screen, transport bar, then the scene list as a shot sheet. */
:root{
  --bg:#0b0a0d;
  --panel:#141217;
  --fg:#ece2cc;
  --muted:#8f8778;
  --line:#2a2630;
  --accent:#d9a441;
  --display:"Bodoni Moda", Didot, "Times New Roman", serif;
  --body:"Cormorant Garamond", Garamond, Georgia, serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:18px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding-block:32px 56px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:grid;gap:28px}
.head{display:grid;gap:6px}
.eyebrow{margin:0;font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(36px,6vw,64px);line-height:1.05;text-wrap:balance;letter-spacing:-.01em}
.logline{margin:4px 0 0;max-width:62ch;font-style:italic;font-size:20px;color:var(--muted)}
.player{display:grid;gap:12px}
.screen{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;box-shadow:0 30px 80px -30px rgba(0,0,0,.8)}
.screen canvas{display:block;width:100%;height:100%;object-fit:contain}
.screen:fullscreen{background:#000}
.bigplay{position:absolute;left:50%;top:72%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:10px;padding:10px 20px 10px 14px;border:1px solid rgba(236,226,204,.45);background:rgba(10,9,12,.55);color:var(--fg);font-family:var(--mono);font-size:13px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(4px)}
.bigplay[hidden]{display:none}
.bigplay:hover{border-color:var(--accent);color:var(--accent)}
.bigplay svg{width:18px;height:18px;fill:currentColor}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ctl{display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;border-radius:2px}
.ctl:hover{border-color:var(--accent);color:var(--accent)}
.ctl svg{width:16px;height:16px;fill:currentColor}
button:focus-visible,.track:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.track{position:relative;flex:1 1 220px;min-width:0;height:40px;cursor:pointer;touch-action:none}
.track::before{content:"";position:absolute;left:0;right:0;top:19px;height:2px;background:var(--line)}
.fill{position:absolute;left:0;top:19px;height:2px;background:var(--accent);width:0}
.tick{position:absolute;top:14px;width:1px;height:12px;background:var(--muted);opacity:.5}
.knob{position:absolute;top:14px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--accent)}
.tc{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:11ch;text-align:right}
.sheet{display:grid;gap:10px}
.sheet h2{margin:0;font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.scenes{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));border-top:1px solid var(--line)}
.scenes li{min-width:0;border-bottom:1px solid var(--line)}
.scenes button{width:100%;display:grid;grid-template-columns:3.2ch 1fr;gap:10px;align-items:baseline;padding:10px 8px;background:none;border:0;color:var(--fg);text-align:left;cursor:pointer;font-family:var(--body);font-size:17px;line-height:1.3}
.scenes button span{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.scenes button:hover{color:var(--accent)}
.scenes button[aria-current="true"]{color:var(--accent)}
.scenes button[aria-current="true"] span{color:var(--accent)}
@media (max-width:520px){.logline{font-size:18px}.tc{min-width:0}}
</style>

</head>
<body>
<main class="wrap">
  <header class="head">
    <p class="eyebrow">A short film · 1 min 24 s · Sound on</p>
    <h1>Smoke Over Verona</h1>
    <p class="logline">Romeo climbs to Juliet's window for tea. A mermaid, a rainstorm, a cohort of aliens and one very social cat have other plans.</p>
  </header>

  <section class="player" aria-label="Film player">
    <div class="screen" id="screen">
      <canvas id="film" width="1280" height="720" role="img" aria-label="Smoke Over Verona, an animated short film"></canvas>
      <button class="bigplay" id="big" type="button" aria-label="Play film"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>Play film</button>
    </div>
    <div class="controls">
      <button class="ctl" id="play" type="button" aria-label="Play"></button>
      <button class="ctl" id="snd" type="button" aria-label="Mute sound" aria-pressed="true"></button>
      <button class="ctl" id="restart" type="button" aria-label="Restart"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <div class="track" id="track" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="84" aria-valuenow="0">
        <div class="fill" id="fill"></div>
        <div id="ticks"></div>
        <div class="knob" id="knob"></div>
      </div>
      <span class="tc" id="tc">00:00 / 01:24</span>
      <button class="ctl" id="fs" type="button" aria-label="Full screen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v2H6v4H4zm10 0h6v6h-2V6h-4zM4 14h2v4h4v2H4zm14 0h2v6h-6v-2h4z"/></svg></button>
    </div>
  </section>

  <section class="sheet" aria-label="Scenes">
    <h2>Shot sheet</h2>
    <ol class="scenes" id="scenes"></ol>
  </section>
</main>

<script>
(() => {
const W = 1280, H = 720, TOP = 92, BOT = 628, FLOOR = 530;
const cv = document.getElementById('film');
let ctx = cv.getContext('2d');
/* reusable offscreen layers for cheap soft effects (blur, smoke) */
const layer = () => { const c = document.createElement('canvas'); return { c, x: c.getContext('2d') }; };
const LA = layer(), LB = layer(), LS = layer();
function fit(L, w, h) { if (L.c.width !== w || L.c.height !== h) { L.c.width = w; L.c.height = h; } }

/* ---------- math ---------- */
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const seg = (p, a, b) => clamp((p - a) / (b - a));
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const TAU = Math.PI * 2;
function ell(x, y, rx, ry, r = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), r, 0, TAU); ctx.fill(); }

function dim(a) { if (a <= 0) return; ctx.fillStyle = `rgba(4,3,8,${a})`; ctx.fillRect(-W, -H, W * 3, H * 3); }

/* ---------- cast ---------- */
const R = { coat: '#1f5c5a', coat2: '#173f3e', trim: '#d6b25e', skin: '#e2b08c', hair: '#2a1a12', hose: '#18130f' };
const J = { dress: '#8e1f33', bodice: '#a8293f', sleeve: '#a8293f', skin: '#f0c6a6', hair: '#b5612a', long: true };

function face(eyes = 'n', mouth = 'flat', blush) {
  ctx.lineCap = 'round';
  for (const ex of [-6, 6]) {
    if (eyes === 'wide') { ctx.fillStyle = '#fff'; ell(ex, 1, 4.2, 4.2); ctx.fillStyle = '#1a1210'; ell(ex, 1.5, 1.8, 1.8); }
    else if (eyes === 'closed') { ctx.strokeStyle = '#1a1210'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(ex - 3, 3); ctx.lineTo(ex + 3, 3); ctx.stroke(); }

    else { ctx.fillStyle = '#1a1210'; ell(ex, 2, 1.9, 1.9); }

  ctx.strokeStyle = '#5a2a22'; ctx.fillStyle = '#5a2a22'; ctx.lineWidth = 1.6; ctx.beginPath();

  else if (mouth === 'grin') { ctx.arc(0, 8, 6, 0, Math.PI); ctx.fill(); }
  else if (mouth === 'o') { ctx.ellipse(0, 11, 3, 4, 0, 0, TAU); ctx.fill(); }
  else if (mouth === 'frown') { ctx.arc(0, 16, 5, Math.PI + .35, -.35); ctx.stroke(); }

function person(x, y, o) {
  const s = o.s || 1, sh = -160, hip = -100;
  ctx.save(); ctx.translate(x, y); ctx.rotate(o.lean || 0); ctx.scale(s, s);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (o.long) { ctx.fillStyle = o.hair; ell(0, -170, 23, 36); }
  if (o.dress) {
    ctx.fillStyle = o.dress; ctx.beginPath(); ctx.moveTo(-15, hip); ctx.lineTo(15, hip);
    ctx.quadraticCurveTo(30, -50, 46, 0); ctx.quadraticCurveTo(0, 8, -46, 0); ctx.quadraticCurveTo(-30, -50, -15, hip); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.22)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-6, hip + 10); ctx.lineTo(-14, -4); ctx.moveTo(8, hip + 10); ctx.lineTo(18, -4); ctx.stroke();

    const a = o.legA || 0;
    ctx.strokeStyle = o.hose; ctx.lineWidth = 11; ctx.beginPath();
    ctx.moveTo(-7, hip); ctx.lineTo(-10 - a * 8, -6); ctx.moveTo(7, hip); ctx.lineTo(10 + a * 8, -6); ctx.stroke();
    ctx.fillStyle = '#100c0a'; ell(-12 - a * 8, -3, 9, 5); ell(12 + a * 8, -3, 9, 5);
    ctx.fillStyle = o.coat2; ell(0, hip + 4, 22, 14);

  ctx.beginPath(); ctx.moveTo(-18, sh - 8); ctx.lineTo(18, sh - 8); ctx.lineTo(16, hip); ctx.lineTo(-16, hip); ctx.closePath(); ctx.fill();
  if (o.trim) { ctx.strokeStyle = o.trim; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, sh - 6); ctx.lineTo(0, hip); ctx.stroke(); ctx.fillStyle = o.trim; ctx.fillRect(-16, hip - 10, 32, 4); }

    const ex = sx + Math.sin(a) * 60, ey = sh + Math.cos(a) * 60;
    ctx.strokeStyle = o.sleeve || o.coat; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(sx, sh); ctx.lineTo(ex, ey); ctx.stroke();

  ctx.fillStyle = o.skin; ctx.fillRect(-4, sh - 20, 8, 14);
  ctx.save(); ctx.translate(0, -186); ctx.rotate(o.tilt || 0);
  ctx.fillStyle = o.skin; ell(0, 0, 17, 17);
  ctx.fillStyle = o.hair; ctx.beginPath(); ctx.arc(0, -1, 18.5, Math.PI, 0);

function hand(x, y, o, side) {

function mermaid(x, y, o) {
  const t = o.t || 0, c = o.curl || 0;
  ctx.save(); ctx.translate(x, y); ctx.rotate(o.rot || 0); ctx.scale(o.s || 1, o.s || 1);
  ctx.lineCap = 'round';
  ctx.fillStyle = '#d9573e'; ctx.beginPath(); ctx.moveTo(-16, -80);
  ctx.quadraticCurveTo(-40 + Math.sin(t * 3) * 6, -40, -28 + Math.sin(t * 2.4) * 8, -5);
  ctx.quadraticCurveTo(-8, -30, 0, -50); ctx.quadraticCurveTo(8, -30, 28 + Math.sin(t * 2.7) * 8, -5);
  ctx.quadraticCurveTo(40 + Math.sin(t * 3.1) * 6, -40, 16, -80); ctx.closePath(); ctx.fill();

  const g = ctx.createLinearGradient(0, 0, 0, ty); g.addColorStop(0, '#2fb5a7'); g.addColorStop(1, '#1c6f8c');

  ctx.lineTo(tx + 5, ty); ctx.bezierCurveTo(10 + c * 28, 88, 26, 45, 17, 0); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(200,255,240,.35)'; ctx.lineWidth = 1.2;
  for (let r = 0; r < 5; r++) { const yy = 12 + r * 18, k = yy / ty, cx = c * 40 * k * k; for (let q = -1; q <= 1; q++) { ctx.beginPath(); ctx.arc(cx + q * 8 * (1 - k * .7), yy, 4, .2, Math.PI - .2); ctx.stroke(); } }
  ctx.save(); ctx.translate(tx, ty); ctx.rotate(c * .4 + Math.sin(t * 6) * .2); ctx.fillStyle = '#43d3c0';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-30, 10, -34, 30); ctx.quadraticCurveTo(-12, 20, 0, 12);
  ctx.quadraticCurveTo(12, 20, 34, 30); ctx.quadraticCurveTo(30, 10, 0, 0); ctx.fill(); ctx.restore();
  ctx.fillStyle = '#e9b48f'; ctx.beginPath(); ctx.moveTo(-17, 2); ctx.lineTo(-14, -52); ctx.lineTo(14, -52); ctx.lineTo(17, 2); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#f3b9cf'; ell(-7, -38, 7, 6); ell(7, -38, 7, 6);
  const arm = (sx, a) => { ctx.strokeStyle = '#e9b48f'; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(sx, -48); ctx.lineTo(sx + Math.sin(a) * 48, -48 + Math.cos(a) * 48); ctx.stroke(); };
  arm(-14, o.aL ?? -.4); arm(14, o.aR ?? .4);
  ctx.fillStyle = '#e9b48f'; ctx.fillRect(-4, -60, 8, 10); ell(0, -70, 15, 15);
  ctx.fillStyle = '#d9573e'; ctx.beginPath(); ctx.arc(0, -72, 16, Math.PI, 0); ctx.quadraticCurveTo(6, -80, -2, -78); ctx.quadraticCurveTo(-10, -80, -16, -72); ctx.fill();
  ctx.save(); ctx.translate(0, -70); ctx.scale(.88, .88); face(o.eyes || 'n', o.mouth || 'smile'); ctx.restore();
  ctx.restore();
}

function alien(x, y, o) {
  const s = o.s || .9, t = o.t || 0;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.lineCap = 'round';
  ctx.strokeStyle = '#6fb850'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(-6, -28); ctx.lineTo(-9, 0); ctx.moveTo(6, -28); ctx.lineTo(9, 0); ctx.stroke();
  ctx.fillStyle = '#b9c3cf'; ell(0, -46, 15, 22);
  ctx.fillStyle = '#d9a441'; ctx.fillRect(-15, -34, 30, 3);
  const arm = (sx, a) => { ctx.strokeStyle = '#8bd36b'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(sx, -60); ctx.lineTo(sx + Math.sin(a) * 34, -60 + Math.cos(a) * 34); ctx.stroke(); };
  arm(-12, o.aL ?? -.3); arm(12, o.aR ?? .3);
  ctx.fillStyle = '#8bd36b'; ell(0, -96, 25, 29);
  ctx.strokeStyle = '#8bd36b'; ctx.lineWidth = 3; ctx.beginPath();
  ctx.moveTo(-8, -122); ctx.lineTo(-14, -140 + Math.sin(t * 5) * 3); ctx.moveTo(8, -122); ctx.lineTo(14, -140 + Math.cos(t * 5) * 3); ctx.stroke();
  ctx.fillStyle = '#ffe27a'; ell(-14, -141 + Math.sin(t * 5) * 3, 3.5, 3.5); ell(14, -141 + Math.cos(t * 5) * 3, 3.5, 3.5);
  ctx.fillStyle = '#0b0d10'; ell(-10, -96, 9, 5.5, .45); ell(10, -96, 9, 5.5, -.45);
  ctx.fillStyle = 'rgba(255,255,255,.8)'; ell(-12, -98, 1.6, 1.6); ell(8, -98, 1.6, 1.6);
  if (o.chew) { const m = Math.abs(Math.sin(t * 14)); ctx.fillStyle = '#2d4a20'; ell(0, -78, 5, 1 + m * 3); }
  else { ctx.strokeStyle = '#2d4a20'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(0, -82, 4, .3, Math.PI - .3); ctx.stroke(); }
  ctx.restore();

function cat(x, y, o) {
  const s = o.s || 1, d = o.dir || 1, t = o.t || 0, col = o.c || '#2b2b31';
  ctx.save(); ctx.translate(x, y); ctx.scale(s * d, s); ctx.rotate(o.rot || 0); ctx.lineCap = 'round';
  ctx.strokeStyle = col; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(-24, -20);
  ctx.quadraticCurveTo(-52, -30, -46 + Math.sin(t * (o.wag || 3)) * 10, -62); ctx.stroke();
  ctx.fillStyle = col;
  let hx, hy;
  if (o.sit) { ell(0, -26, 20, 26); ell(8, -3, 7, 4); ell(18, -3, 7, 4); hx = 10; hy = -60; }
  else {
    ell(0, -24, 32, 16);
    for (const k of [-20, -8, 12, 22]) { const ph = o.walk ? Math.sin(t * 12 + k) * 4 : 0; ctx.fillRect(k - 3 + ph, -14, 6, 14); }

  ctx.beginPath(); ctx.moveTo(hx - 12, hy - 6); ctx.lineTo(hx - 9, hy - 22); ctx.lineTo(hx - 2, hy - 12); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(hx + 2, hy - 12); ctx.lineTo(hx + 9, hy - 22); ctx.lineTo(hx + 12, hy - 6); ctx.closePath(); ctx.fill();
  if (o.eyes === 'sleepy') { ctx.strokeStyle = '#f2d24b'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(hx - 7, hy - 1); ctx.lineTo(hx - 1, hy - 1); ctx.moveTo(hx + 3, hy - 1); ctx.lineTo(hx + 9, hy - 1); ctx.stroke(); }
  else {
    ctx.fillStyle = o.eyes === 'angry' ? '#ff5a3a' : '#f2d24b'; ell(hx - 4, hy - 2, 3, 3.6); ell(hx + 6, hy - 2, 3, 3.6);

    if (o.eyes === 'angry') { ctx.strokeStyle = '#0b0b0b'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(hx - 8, hy - 9); ctx.lineTo(hx - 1, hy - 6); ctx.moveTo(hx + 10, hy - 9); ctx.lineTo(hx + 3, hy - 6); ctx.stroke(); }
  }

  ctx.restore();
}

/* ---------- props ---------- */
function cup(x, y, s = 1, rot = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.fillStyle = '#f1e8d8'; ctx.beginPath(); ctx.moveTo(-11, -16); ctx.lineTo(11, -16); ctx.quadraticCurveTo(10, 0, 0, 0); ctx.quadraticCurveTo(-10, 0, -11, -16); ctx.fill();
  ctx.strokeStyle = '#f1e8d8'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(12, -9, 5, -1.4, 1.4); ctx.stroke();
  ctx.fillStyle = '#b8862f'; ctx.fillRect(-11, -14, 22, 2);
  ctx.fillStyle = '#e6dccb'; ell(0, 1, 16, 3);
  ctx.restore();
}
function teapot(x, y, rot = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.fillStyle = '#ece3d2';

/* ---------- player ---------- */
const playBtn = document.getElementById('play'), big = document.getElementById('big'), track = document.getElementById('track');
const fill = document.getElementById('fill'), knob = document.getElementById('knob'), tc = document.getElementById('tc'), list = document.getElementById('scenes');
const ICON_PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>';
const POSTER = 3.2;
let time = 0, playing = false, started = false, last = null, curScene = -1;
const fmt = s => { s = Math.floor(s); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };

const ticks = document.getElementById('ticks');
starts.forEach((s, i) => { if (i === 0) return; const d = document.createElement('div'); d.className = 'tick'; d.style.left = (s / total * 100) + '%'; ticks.appendChild(d); });
scenes.forEach((s, i) => {

  b.addEventListener('click', () => { time = starts[i] + .01; Sound.seek(time); started = true; setPlaying(true); });
  li.appendChild(b); list.appendChild(li);
});

function setPlaying(v) {
  if (v) { started = true; if (time >= total - .02) { time = 0; Sound.seek(0); } Sound.init(); }

}
function ui() {
  playBtn.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
  playBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play');
  big.hidden = started;
}

  const f = (started ? time : 0) / total * 100;

function loop(ts) {

    last = ts;
    if (time >= total) { playing = false; ui(); }

playBtn.addEventListener('click', () => setPlaying(!playing));
big.addEventListener('click', () => setPlaying(true));

document.getElementById('fs').addEventListener('click', () => {
  const el = document.getElementById('screen');
  try { if (document.fullscreenElement) document.exitFullscreen(); else { const r = el.requestFullscreen && el.requestFullscreen(); if (r && r.catch) r.catch(() => {}); } } catch (e) {}
});
cv.addEventListener('click', () => setPlaying(!playing));
const seek = e => { const r = track.getBoundingClientRect(); time = clamp((e.clientX - r.left) / r.width) * total; Sound.seek(time); started = true; ui(); };
track.addEventListener('pointerdown', e => { seek(e); try { track.setPointerCapture(e.pointerId); } catch (_) {} });
track.addEventListener('pointermove', e => { if (e.buttons) seek(e); });
track.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { time = Math.min(total, time + 5); Sound.seek(time); started = true; ui(); e.preventDefault(); }
  if (e.key === 'ArrowLeft') { time = Math.max(0, time - 5); Sound.seek(time); started = true; ui(); e.preventDefault(); }

document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !(e.target instanceof HTMLButtonElement) && e.target !== track) { e.preventDefault(); setPlaying(!playing); }
});

const sndBtn = document.getElementById('snd');
const ICON_SND = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h4l5-4v14l-5-4H3zM15.5 8.5a5 5 0 010 7l-1.4-1.4a3 3 0 000-4.2zM18.4 5.6a9 9 0 010 12.8L17 17a7 7 0 000-9.9z"/></svg>';
