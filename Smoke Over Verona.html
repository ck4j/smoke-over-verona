<style>

<main class="wrap">

    <p class="logline">Romeo climbs to Juliet's window for tea. A mermaid, a rainstorm, a cohort of aliens and one very social cat have other plans.</p>
  </header>

    </div>

  </section>
</main>

  { d: 5, name: 'Title', slug: '', cap: '', draw: s0 },
  { d: 6, name: 'The climb', slug: 'EXT. CAPULET WALL — NIGHT', cap: 'Verona, before the rain. Romeo climbs to Juliet’s window.', draw: s1 },
  { d: 5, name: 'Tea for two', slug: 'INT. JULIET’S CHAMBER — NIGHT', cap: 'A quiet cup of tea. Nothing unusual. Yet.', draw: s2 },
  { d: 5, name: 'The mermaid', slug: 'INT. JULIET’S CHAMBER — CONTINUOUS', cap: 'A mermaid crashes through the window. Out of water, she cannot breathe.', draw: s3 },
  { d: 5, name: 'The spell', slug: 'INT. JULIET’S CHAMBER — CONTINUOUS', cap: 'So she casts a spell, and the rain comes at once.', draw: s4 },
  { d: 6, name: 'Exit by water', slug: 'INT. JULIET’S CHAMBER — CONTINUOUS', cap: 'She bends the rain into a river, rides it out, and takes every teacup with her.', draw: s5 },
  { d: 6, name: 'The delivery', slug: 'INT. JULIET’S CHAMBER — LATER', cap: 'A cohort of aliens arrives, carrying a cat.', draw: s6 },
  { d: 5, name: 'The biscuits', slug: 'INT. JULIET’S CHAMBER — CONTINUOUS', cap: 'They take the biscuits by force, and eat them on the spot.', draw: s7 },
  { d: 5, name: 'Departure', slug: 'INT. JULIET’S CHAMBER — CONTINUOUS', cap: 'Then they leave, perfectly peacefully.', draw: s8 },
  { d: 6, name: 'Juliet', slug: 'INT. JULIET’S CHAMBER — MOMENTS LATER', cap: 'It is all too much for Juliet’s heart.', draw: s9 },
  { d: 6, name: 'Romeo', slug: 'INT. JULIET’S CHAMBER — LATER', cap: 'Romeo cannot save her. He drinks until the dark comes.', draw: s10 },
  { d: 7, name: 'The party', slug: 'INT. JULIET’S CHAMBER — DEEP NIGHT', cap: 'The cat knocks the bottle down and invites its friends over.', draw: s11 },
  { d: 5, name: 'The smash', slug: 'INT. JULIET’S CHAMBER — DEEP NIGHT', cap: 'One drunk guest smashes the bottle in a rage, then storms out.', draw: s12 },
  { d: 8, name: 'Morning', slug: 'INT. ROMEO’S ROOM — DAWN', cap: 'Romeo wakes in a room full of smoke. He looks at his pot, and smiles.', draw: s13 },
  { d: 4, name: 'Fin', slug: '', cap: '', draw: s14 },
];
const starts = []; let total = 0;
for (const s of scenes) { starts.push(total); total += s.d; }

/* ---------- finishing ---------- */
const noise = document.createElement('canvas'); noise.width = noise.height = 200;
{ const nc = noise.getContext('2d'), id = nc.createImageData(200, 200); for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; } nc.putImageData(id, 0, 0); }
const grainPat = ctx.createPattern(noise, 'repeat');

function sceneAt(T) { let i = 0; while (i < scenes.length - 1 && T >= starts[i + 1]) i++; return i; }
function render(T) {
  const i = sceneAt(T), sc = scenes[i], t = T - starts[i], p = clamp(t / sc.d);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.save(); sc.draw(t, p, sc.d); ctx.restore();
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  const f = Math.max(clamp(1 - t / .6), clamp(1 - (sc.d - t) / .6));
  if (f > 0) { ctx.fillStyle = `rgba(0,0,0,${f})`; ctx.fillRect(0, 0, W, H); }
  const vg = ctx.createRadialGradient(640, 360, 260, 640, 360, 760); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.6)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(-Math.random() * 200, -Math.random() * 200); ctx.globalAlpha = .06; ctx.fillStyle = grainPat; ctx.fillRect(0, 0, W + 200, H + 200); ctx.restore();
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, TOP); ctx.fillRect(0, BOT, W, H - BOT);
  ctx.textBaseline = 'middle';
  if (sc.slug) {
    const sa = .55 * seg(t, .3, 1) * (1 - seg(t, sc.d - .5, sc.d));
    ctx.font = '500 13px "IBM Plex Mono", monospace'; if ('letterSpacing' in ctx) ctx.letterSpacing = '3px';
    ctx.fillStyle = `rgba(217,164,65,${sa})`; ctx.textAlign = 'left'; ctx.fillText('SC. ' + String(i).padStart(2, '0'), 40, TOP / 2);
    ctx.fillStyle = `rgba(236,226,204,${sa})`; ctx.textAlign = 'right'; ctx.fillText(sc.slug, 1240, TOP / 2);
    if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
  }
  if (sc.cap) {
    const ca = seg(t, .5, 1.1) * (1 - seg(t, sc.d - .5, sc.d));
    let size = 32; ctx.font = `italic 400 ${size}px "Cormorant Garamond", Georgia, serif`;
    while (ctx.measureText(sc.cap).width > 1180 && size > 20) { size--; ctx.font = `italic 400 ${size}px "Cormorant Garamond", Georgia, serif`; }
    ctx.textAlign = 'center'; ctx.fillStyle = `rgba(236,226,204,${ca})`; ctx.fillText(sc.cap, 640, BOT + (H - BOT) / 2);
  }
  ctx.textBaseline = 'alphabetic';
}

/* ---------- player ---------- */
const playBtn = document.getElementById('play'), big = document.getElementById('big'), track = document.getElementById('track');
const fill = document.getElementById('fill'), knob = document.getElementById('knob'), tc = document.getElementById('tc'), list = document.getElementById('scenes');
const ICON_PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>';
const POSTER = 3.2;
let time = 0, playing = false, started = false, last = null, curScene = -1;
const fmt = s => { s = Math.floor(s); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };

const ticks = document.getElementById('ticks');
starts.forEach((s, i) => { if (i === 0) return; const d = document.createElement('div'); d.className = 'tick'; d.style.left = (s / total * 100) + '%'; ticks.appendChild(d); });
scenes.forEach((s, i) => {
  if (i === 0 || i === scenes.length - 1) return;
  const li = document.createElement('li'), b = document.createElement('button');
  b.type = 'button'; b.id = 'scene-' + i; b.innerHTML = `<span>${String(i).padStart(2, '0')}</span>${s.name}`;
  b.addEventListener('click', () => { time = starts[i] + .01; started = true; setPlaying(true); });
  li.appendChild(b); list.appendChild(li);
});

function setPlaying(v) {
  if (v) { started = true; if (time >= total - .02) time = 0; }
  playing = v; ui();
}
function ui() {
  playBtn.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
  playBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play');
  big.hidden = started;
}
function progress() {
  const f = (started ? time : 0) / total * 100;
  fill.style.width = f + '%'; knob.style.left = f + '%';
  tc.textContent = fmt(started ? time : 0) + ' / ' + fmt(total);
  track.setAttribute('aria-valuenow', Math.round(started ? time : 0));
  const si = started ? sceneAt(time) : -1;
  if (si !== curScene) {
    const prev = document.getElementById('scene-' + curScene); if (prev) prev.removeAttribute('aria-current');
    const nx = document.getElementById('scene-' + si); if (nx) nx.setAttribute('aria-current', 'true');
    curScene = si;
  }
}
function loop(ts) {
  if (playing) {
    if (last !== null) time = Math.min(total, time + (ts - last) / 1000);
    last = ts;
    if (time >= total) { playing = false; ui(); }
  } else last = null;
  render(started ? Math.min(time, total - .001) : POSTER);
  progress();
  requestAnimationFrame(loop);
}

playBtn.addEventListener('click', () => setPlaying(!playing));
big.addEventListener('click', () => setPlaying(true));
document.getElementById('restart').addEventListener('click', () => { time = 0; setPlaying(true); });
document.getElementById('fs').addEventListener('click', () => {
  const el = document.getElementById('screen');
  try { if (document.fullscreenElement) document.exitFullscreen(); else { const r = el.requestFullscreen && el.requestFullscreen(); if (r && r.catch) r.catch(() => {}); } } catch (e) {}
});
cv.addEventListener('click', () => setPlaying(!playing));
const seek = e => { const r = track.getBoundingClientRect(); time = clamp((e.clientX - r.left) / r.width) * total; started = true; ui(); };
track.addEventListener('pointerdown', e => { seek(e); try { track.setPointerCapture(e.pointerId); } catch (_) {} });
track.addEventListener('pointermove', e => { if (e.buttons) seek(e); });
track.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { time = Math.min(total, time + 5); started = true; ui(); e.preventDefault(); }
  if (e.key === 'ArrowLeft') { time = Math.max(0, time - 5); started = true; ui(); e.preventDefault(); }
});
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !(e.target instanceof HTMLButtonElement) && e.target !== track) { e.preventDefault(); setPlaying(!playing); }
});

ui();
requestAnimationFrame(loop);
if (document.fonts && document.fonts.load) {
  ['400 84px "Bodoni Moda"', 'italic 400 32px "Cormorant Garamond"', '500 13px "IBM Plex Mono"', 'italic 400 96px "Bodoni Moda"'].forEach(f => document.fonts.load(f).catch(() => {}));
}
})();
</script>
